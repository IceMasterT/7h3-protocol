[build-system]
# Upper-bounded deliberately: hatchling >= 1.28 emits Metadata-Version 2.5,
# which the twine bundled in the pinned pypa/gh-action-pypi-publish rejects
# with "InvalidDistribution: '2.5' is not a valid metadata version" — it
# failed the v0.6.0 publish. Lift this once the publish action is bumped to a
# release whose twine understands 2.5.
requires = ["hatchling>=1.21,<1.28"]
build-backend = "hatchling.build"

[project]
name = "7h3-protocol"
version = "0.6.0"
description = "7h3 Protocol — Python SDK. Deterministic, signed, replay-safe AI-to-AI messaging. Wire version 7h3/0.1."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["7h3", "agent", "protocol", "ed25519", "mcp", "signing", "replay-protection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=41.0"]
nacl = ["PyNaCl>=1.5"]

[project.urls]
Homepage = "https://github.com/IceMasterT/7h3-protocol"
Repository = "https://github.com/IceMasterT/7h3-protocol"
Documentation = "https://github.com/IceMasterT/7h3-protocol/tree/main/sdk/python"
Changelog = "https://github.com/IceMasterT/7h3-protocol/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["protocol_7h3"]
