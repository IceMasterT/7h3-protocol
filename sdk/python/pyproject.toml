[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aip7h3"
version = "0.1.2"
description = "AIP (Aurelion Interaction Protocol) — Python SDK. Deterministic, signed, replay-safe AI-to-AI messaging. Wire version aip/0.1."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["aip", "agent", "protocol", "ed25519", "mcp", "signing", "replay-protection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=41.0"]
nacl = ["PyNaCl>=1.5"]

[project.urls]
Homepage = "https://github.com/IceMasterT/7h3-protocol-aip"
Repository = "https://github.com/IceMasterT/7h3-protocol-aip"
Documentation = "https://github.com/IceMasterT/7h3-protocol-aip/tree/main/sdk/python"
Changelog = "https://github.com/IceMasterT/7h3-protocol-aip/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["aip7h3"]
