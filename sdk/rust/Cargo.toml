[package]
name = "aip7h3"
version = "0.1.0"
edition = "2021"
description = "AIP (Aurelion Interaction Protocol) — Rust SDK. Deterministic, signed, replay-safe AI-to-AI messaging with TypeScript/Python parity. Wire version aip/0.1."
license = "Apache-2.0"
repository = "https://github.com/IceMasterT/7h3-protocol-aip"
homepage = "https://github.com/IceMasterT/7h3-protocol-aip"
documentation = "https://docs.rs/aip7h3"
keywords = ["aip", "agent", "protocol", "ed25519", "mcp"]
categories = ["cryptography", "network-programming", "web-programming::http-server"]
readme = "README.md"
include = ["src/**/*", "README.md", "Cargo.toml", "LICENSE", "NOTICE"]

[lib]
name = "aip7h3"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
