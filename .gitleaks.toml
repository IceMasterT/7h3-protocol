# Extend gitleaks' default ruleset; everything not allowlisted below is still scanned.
[extend]
useDefault = true

[allowlist]
description = "Public test vectors that are published in standards documents, not secrets"
regexes = [
  # RFC 9421 Appendix B.1.4 "test-key-ed25519" private key (PKCS#8, base64url).
  # Published in the RFC and reused by the Web Bot Auth draft; the test suite uses it
  # to reproduce the RFC's own signatures byte for byte.
  '''MC4CAQAwBQYDK2VwBCIEIJ-DYvh6SEqVTm50DFtMDoQikTmiCqirVv9mWG9qfSnF''',
  # The test constants that hold it. The generic-api-key rule can capture the
  # identifier (`privateKey: RFC_ED25519_PRIVATE`) instead of the value.
  '''^RFC_(ED25519_)?PRIVATE$''',
  # did:key identifiers (multibase base58btc `z…`). A did:key is a PUBLIC key identifier by
  # definition; the test vectors come from the W3C did:key specification.
  '''^z[1-9A-HJ-NP-Za-km-z]{43,60}$''',
  # RFC 9449 Figure 13 example DPoP proof (a signed JWT with the RFC's example public
  # key in its header). Published in the RFC; the test verifies it as received.
  '''^eyJ0eXAiOiJkcG9wK2p3dCIsImFsZyI6IkVTMjU2IiwiandrIjp7Imt0eSI6IkVDIiwieCI6Imw4dEZyaHgt''',
]
