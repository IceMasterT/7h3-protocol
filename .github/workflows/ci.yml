name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      # npm ci: install exactly what the committed lockfile pins
      - run: npm ci
      # Sub-package SDKs carry their own deps (@noble/post-quantum, @noble/curves)
      # and their tests run under the root vitest suite
      # npm install (not ci): these lockfiles pin the @7h3/protocol peer dep,
      # which changes every release and would desync npm ci on each bump
      - run: npm install --no-audit --no-fund --prefix sdk/pq
      - run: npm install --no-audit --no-fund --prefix sdk/threshold
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run test
      - run: npm run build:protocol

      # sdk/webmcp ships multiple files, so unlike the bundled core its emitted
      # ESM specifiers have to resolve under Node. vitest does not exercise that
      # — it resolves extensionless imports — so pack/install/import here, where
      # a break is cheap, rather than discovering it on the registry.
      - name: Smoke test @7h3/protocol-webmcp package
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run smoke
        working-directory: sdk/webmcp

      - name: Smoke test @7h3/protocol-browser package
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run smoke
        working-directory: sdk/browser

      - name: Smoke test @7h3/protocol-mcp package
        run: |
          npm ci
          npm run build
          npm run smoke
        working-directory: mcp-server

      - name: Fuzz smoke (decode + verify harnesses)
        run: npm run fuzz:ts
        env:
          FUZZ_ROUNDS: '5000'
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build:protocol
      # npm install (not ci): cloudflare/package-lock.json pins the @7h3/protocol
      # file: dep, which changes every release and would desync npm ci on each bump
      - run: npm install --no-audit --no-fund --prefix cloudflare
      - run: npm run typecheck --prefix cloudflare
      - run: npm run test --prefix cloudflare
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # Pinned so conformance runs are reproducible; dependabot bumps the pin
      - run: pip install -r sdk/python/requirements-ci.txt
      - run: npm ci
      - run: npm run conformance:python
      - run: npm run conformance:rust
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      # mcp-server's lockfile links @7h3/protocol to the repo root (file:..),
      # so the root package must be installed and built first
      - run: npm ci
      - run: npm run build:protocol
      - run: npm ci --no-audit --no-fund --prefix mcp-server
      # build runs tsc, so this is both the typecheck and the packaging check
      - run: npm run build --prefix mcp-server
