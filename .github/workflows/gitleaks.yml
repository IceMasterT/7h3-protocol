name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # daily; catches secrets landed while CI was quiet

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history so leaks buried in old commits are found, not just HEAD
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
