name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish-protocol:
    name: publish @7h3/protocol
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build dist/npm-protocol
        run: npm run package:protocol

      # Makes this job (and the tag push that triggers it) safe to retry: a
      # partial release failure elsewhere used to require re-running this
      # job too, which then failed on "cannot publish over previously
      # published version" and cascaded into every `needs: publish-protocol`
      # job being skipped instead of retried.
      - name: Check if already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: dist/npm-protocol

      - name: Publish @7h3/protocol
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance --access public
        working-directory: dist/npm-protocol
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: publish 7h3-protocol (PyPI, trusted publishing)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI trusted publishing — no API token
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build sdk/python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: sdk/python/dist
          skip-existing: true

  publish-mcp:
    name: publish @7h3/protocol-mcp
    needs: publish-protocol
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: mcp-server

      - name: Build mcp-server
        run: npm run build
        working-directory: mcp-server

      - name: Check if already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: mcp-server

      - name: Publish @7h3/protocol-mcp
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance --access public
        working-directory: mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-webmcp:
    name: publish @7h3/protocol-webmcp
    needs: publish-protocol
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The package's tsconfig resolves @7h3/protocol's types through
      # ../../dist/protocol, so the core has to be built at the repo root before
      # sdk/webmcp can typecheck — unlike sdk/pq, which only needs its own deps.
      - name: Build the core protocol
        run: |
          npm ci
          npm run build:protocol

      # npm install (not ci): sdk/webmcp's lockfile pins the @7h3/protocol peer
      # dep, which changes every release and would desync npm ci on each bump
      # (see the same note in ci.yml).
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: sdk/webmcp

      - name: Build and test @7h3/protocol-webmcp
        run: |
          npm run build
          npm test
        working-directory: sdk/webmcp

      - name: Check if already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: sdk/webmcp

      - name: Publish @7h3/protocol-webmcp
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance --access public
        working-directory: sdk/webmcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pq:
    name: publish @7h3/protocol-pq
    needs: publish-protocol
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm install (not ci): sdk/pq's lockfile pins the @7h3/protocol peer
      # dep, which changes every release and would desync npm ci on each bump
      # (see the same note in ci.yml).
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: sdk/pq

      - name: Build and test @7h3/protocol-pq
        run: |
          npm run build
          npm test
        working-directory: sdk/pq

      - name: Check if already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: sdk/pq

      - name: Publish @7h3/protocol-pq
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance --access public
        working-directory: sdk/pq
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-threshold:
    name: publish @7h3/protocol-threshold
    needs: publish-protocol
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm install (not ci): sdk/threshold's lockfile pins the @7h3/protocol
      # peer dep, which changes every release and would desync npm ci on each
      # bump (see the same note in ci.yml).
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: sdk/threshold

      - name: Build and test @7h3/protocol-threshold
        run: |
          npm run build
          npm test
        working-directory: sdk/threshold

      - name: Check if already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: sdk/threshold

      - name: Publish @7h3/protocol-threshold
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance --access public
        working-directory: sdk/threshold
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crate:
    name: publish protocol-7h3 (crates.io)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Cross-runtime conformance vectors and cargo test already run in CI on
      # every push; this job only re-verifies the exact commit being tagged
      # before publishing it.
      - name: Test
        run: cargo test --manifest-path sdk/rust/Cargo.toml

      - name: Check if already published
        id: check
        run: |
          NAME=$(grep '^name' sdk/rust/Cargo.toml | head -1 | cut -d'"' -f2)
          VERSION=$(grep '^version' sdk/rust/Cargo.toml | head -1 | cut -d'"' -f2)
          if curl -sf -H "User-Agent: $NAME-publish-check (github-actions)" "https://crates.io/api/v1/crates/$NAME/$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # CARGO_REGISTRY_TOKEN is a classic crates.io API token stored as a repo
      # secret. Once a Trusted Publisher is configured for this crate
      # (crates.io -> protocol-7h3 -> Settings -> Trusted Publishing ->
      # repository IceMasterT/7h3-protocol, workflow publish.yml), this can
      # switch to rust-lang/crates-io-auth-action (OIDC, no stored token) —
      # see git history for the prior version of this job.
      - name: Publish protocol-7h3
        if: steps.check.outputs.exists == 'false'
        run: cargo publish --manifest-path sdk/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
