name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish-protocol:
    name: publish @7h3/protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build dist/npm-protocol
        run: npm run package:protocol

      - name: Publish @7h3/protocol
        run: npm publish --provenance --access public
        working-directory: dist/npm-protocol

  publish-pypi:
    name: publish 7h3-protocol (PyPI, trusted publishing)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI trusted publishing — no API token
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build sdk/python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: sdk/python/dist

  publish-mcp:
    name: publish @7h3/protocol-mcp
    needs: publish-protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: mcp-server

      - name: Build mcp-server
        run: npm run build
        working-directory: mcp-server

      - name: Publish @7h3/protocol-mcp
        run: npm publish --provenance --access public
        working-directory: mcp-server

  publish-pq:
    name: publish @7h3/protocol-pq
    needs: publish-protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm install (not ci): sdk/pq's lockfile pins the @7h3/protocol peer
      # dep, which changes every release and would desync npm ci on each bump
      # (see the same note in ci.yml).
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: sdk/pq

      - name: Build and test @7h3/protocol-pq
        run: |
          npm run build
          npm test
        working-directory: sdk/pq

      - name: Publish @7h3/protocol-pq
        run: npm publish --provenance --access public
        working-directory: sdk/pq

  publish-threshold:
    name: publish @7h3/protocol-threshold
    needs: publish-protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm install (not ci): sdk/threshold's lockfile pins the @7h3/protocol
      # peer dep, which changes every release and would desync npm ci on each
      # bump (see the same note in ci.yml).
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: sdk/threshold

      - name: Build and test @7h3/protocol-threshold
        run: |
          npm run build
          npm test
        working-directory: sdk/threshold

      - name: Publish @7h3/protocol-threshold
        run: npm publish --provenance --access public
        working-directory: sdk/threshold

  publish-crate:
    name: publish protocol-7h3 (crates.io, trusted publishing)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token exchanged for a short-lived crates.io token — no long-lived secret
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Cross-runtime conformance vectors and cargo test already run in CI on
      # every push; this job only re-verifies the exact commit being tagged
      # before publishing it.
      - name: Test
        run: cargo test --manifest-path sdk/rust/Cargo.toml

      # Requires a one-time Trusted Publisher configuration on crates.io for
      # this crate (Settings -> Trusted Publishing on the protocol-7h3 crate
      # page): repository IceMasterT/7h3-protocol, workflow publish.yml. This
      # can only be configured after the crate has been published at least
      # once — protocol-7h3 already has releases on crates.io, so this is a
      # one-time manual step, not a blocker for every future release.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish protocol-7h3
        run: cargo publish --manifest-path sdk/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
