version: 2
updates:
  # Root package (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      npm-non-security:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # typescript-eslint 8.x declares `peer typescript ">=4.8.4 <6.1.0"`, so
      # bumping typescript to 7.x makes `npm install` fail with ERESOLVE and
      # takes every downstream job with it. Scoped to version-update:* so
      # security advisories for typescript are still raised. Remove once
      # typescript-eslint ships stable TypeScript 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # mcp-server sub-package (npm)
  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      npm-mcp-non-security:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # Keep typescript on one major across every package -- see the root entry.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Crypto SDK sub-packages (npm). These hold the cryptography dependencies --
  # @noble/post-quantum (sdk/pq) and @noble/curves (sdk/threshold) -- and were
  # previously unmonitored, so neither version updates nor security alerts
  # reached them. Kept as their own group, separate from the Cloudflare worker
  # below: a breaking @noble major bump must not hold hostage routine wrangler
  # updates (and vice versa).
  # sdk/browser is omitted deliberately: it declares no dependencies.
  - package-ecosystem: "npm"
    directories:
      - "/sdk/pq"
      - "/sdk/threshold"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      npm-sdk-non-security:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # Keep typescript on one major across every package -- see the root entry.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Cloudflare worker (npm): wrangler, @cloudflare/workers-types. Isolated from
  # the crypto SDK group so its bumps land independently.
  - package-ecosystem: "npm"
    directory: "/cloudflare"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      npm-cloudflare-non-security:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # Keep typescript on one major across every package -- see the root entry.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Rust SDK and its fuzz harness (cargo): ed25519-dalek, getrandom, sha2, hmac.
  - package-ecosystem: "cargo"
    directories:
      - "/sdk/rust"
      - "/sdk/rust/fuzz"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      cargo-non-security:
        applies-to: version-updates
        patterns:
          - "*"

  # Go SDK (gomod): golang.org/x/crypto.
  - package-ecosystem: "gomod"
    directory: "/sdk/go"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      gomod-non-security:
        applies-to: version-updates
        patterns:
          - "*"

  # Python SDK CI deps (pip): the SDK itself declares `dependencies = []`,
  # but the conformance suite pins `cryptography` in requirements-ci.txt —
  # a crypto dependency that must receive security updates.
  - package-ecosystem: "pip"
    directory: "/sdk/python"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      pip-non-security:
        applies-to: version-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
